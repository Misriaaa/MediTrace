<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="dashboard-page">

<div class="dashboard">

    <!-- Sidebar -->
    <div class="sidebar">
        <h2>MediTrace</h2>

        <ul>
    <li onclick="loadPendingUsers()">Pending Registrations</li>
    <li onclick="loadApprovedUsers()">Approved Users</li>
    <li onclick="loadTransactions()">Transaction History</li>
    <li onclick="window.location.href='trace.html'">Trace Medicines</li>
    <li onclick="logout()">Logout</li>
</ul>
    </div>

    <!-- Main Content -->
    <div class="main-content">

        <div class="topbar">
            <h1>Admin Dashboard</h1>
            <span>System Control Panel</span>
        </div>

        <!-- USERS -->
        <div class="cards" id="userTable"></div>

        <!-- TRANSACTIONS -->
        <div id="transactionTable"></div>

        <div class="cards">

<div class="card">
<h3>Total Users</h3>
<p id="totalUsers">0</p>
</div>

<div class="card">
<h3>Pending Approvals</h3>
<p id="pendingUsers">0</p>
</div>

<div class="card">
<h3>Total Medicines</h3>
<p id="totalMedicines">0</p>
</div>

<div class="card">
<h3>Transactions</h3>
<p id="totalTransactions">0</p>
</div>

</div>

    </div>

</div>

<script>
function logout(){
    localStorage.clear();
    window.location.href="login.html";
}
</script>

<script src="js/admin.js"></script>

</body>
</html>
