<!DOCTYPE html>
<html>
<head>
    <title>Pharmacy Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="dashboard-page">

<div class="dashboard">

    <!-- Sidebar -->
    <div class="sidebar">
        <h2>SupplyChain</h2>
        <ul>
            <li onclick="window.location.href='received-products.html'">View Received</li>
            <li onclick="window.location.href='verify-medicine.html'">Verify Medicines</li>
            <li onclick="window.location.href='scan-medicine.html'">Scan Medicines</li>
            <li onclick="window.location.href='trace.html'">Trace Medicines</li>
            <li onclick="logout()">Logout</li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="main-content">

        <div class="topbar">
            <h1>Pharmacy Dashboard</h1>
            <span>Welcome...</span>
        </div>

        <div class="cards">

            <div class="card">
                <h3>Total Medicines</h3>
                <p id="totalMedicines">0</p>
            </div>

            <div class="card">
                <h3>Verified</h3>
                <p>0</p>
            </div>

            <div class="card">
                <h3>Available Stock</h3>
                <p>0</p>
            </div>

        </div>

    </div>

</div>


<a href="scan.html">
<button>📷 Scan Medicine</button>
</a>

<script>
function logout() {
    localStorage.clear();
    window.location.href = "login.html";
}
</script>

<script src="js/pharmacy.js"></script>

</body>
</html>
