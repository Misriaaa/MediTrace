<!DOCTYPE html>
<html>
<head>
<title>Manufacturer Dashboard</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body class="dashboard-page">

<div class="dashboard">

<!-- Sidebar -->
<div class="sidebar">
<h2>SupplyChain</h2>

<ul>
<li onclick="window.location.href='add-product.html'">Add Medicines</li>
<li onclick="window.location.href='my-products.html'">My Products</li>
<li onclick="window.location.href='ship-products.html'">Ship Products</li>
<li onclick="window.location.href='shipped-products.html'">Shipped Products</li>
<li onclick="window.location.href='trace.html'">Trace Medicine</li>
<li onclick="logout()">Logout</li>
</ul>

</div>

<!-- Main Content -->
<div class="main-content">

<div class="topbar">
<h1>Manufacturer Dashboard</h1>
<span>Welcome...</span>
</div>

<div class="cards">

<div class="card">
<h3>Total Products</h3>
<p id="totalProducts">0</p>
</div>


<div class="card">
<h3>Shipped</h3>
<p>0</p>
</div>
</div>
<!-- QR CODE SECTION -->

<div class="qrcard glass-form">
    <h2>Medicine QR Code</h2>

    <input type="number" id="qrMedicineId" placeholder="Enter Medicine ID">

    <button onclick="generateDashboardQR()">Generate QR</button>
    <button onclick="downloadQR()">Download QR</button>
    <button onclick="goBack()">Back</button>


<div id="qrCanvas"></div>

</div>

</div>

</div>

<script src="js/qrcode.min.js"></script>

<script>

function logout(){
localStorage.clear();
window.location.href="login.html";
}
</script>
<script src="js/manufacturer.js"></script>

</body>
</html>
